name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight PR runs; never cancel a build of main itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Single source of truth with local dev; see frontend/.nvmrc.
          node-version-file: frontend/.nvmrc
          cache: npm
          # Required: the lockfile is not at the repo root. Paths on `uses:`
          # steps are ALWAYS repo-root-relative — defaults.run.working-directory
          # applies to `run:` steps only.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build BEFORE typecheck. tsconfig.json includes next-env.d.ts and
      # .next/types/**/*.ts; both are gitignored and generated by `next build`,
      # so typechecking first would run against a project missing Next's
      # ambient and typed-route declarations.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # backend/.env is gitignored and therefore absent in CI, but
      # app/core/config.py's _require_provider_credentials validator raises
      # unless the selected provider's key is non-empty. This is a placeholder
      # literal, never a secret: nothing in the suite makes a network call, and
      # PRs from forks cannot read repository secrets anyway.
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: claude-opus-5
      WORKSPACE_ROOT: ./workspace
      CORS_ORIGINS: http://localhost:3000
      # DATABASE_URL intentionally unset: it is Optional by design, the
      # workflow routes return 503 without it, and no test opens a connection.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Quoted: unquoted this is a YAML float. Pinned because a runner
          # image bump to 3.13 could outrun the wheels for the exact
          # psycopg-binary / uvloop / orjson pins in requirements.txt.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # cwd is backend/ via defaults.run.working-directory: pytest.ini uses a
      # relative `testpaths = tests`, and prepend import mode puts backend/ on
      # sys.path so `import app.*` resolves.
      - name: Test
        run: python -m pytest -q
